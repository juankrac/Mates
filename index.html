<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Expedición Matemática 3D — Prueba</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; font-family: sans-serif; }
  #canvas-container { width: 100vw; height: 100vh; display: block; }
  #debug {
    position: fixed; top: 10px; left: 10px;
    background: rgba(0,0,0,0.7); color: #0f0;
    padding: 10px; font-family: monospace; font-size: 12px;
    border-radius: 8px; z-index: 999; max-width: 400px;
    white-space: pre-wrap;
  }
  #loading {
    position: fixed; inset: 0; background: #87ceeb;
    display: flex; justify-content: center; align-items: center;
    font-size: 2rem; color: white; z-index: 1000;
    transition: opacity 0.5s;
  }
</style>
</head>
<body>
<div id="loading">Cargando mundo 3D…</div>
<div id="canvas-container"></div>
<div id="debug">Iniciando…</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
  }
}
</script>

<script type="module">
import * as THREE from 'three';

const debugEl = document.getElementById('debug');
const log = (msg) => {
  console.log(msg);
  debugEl.textContent += '\n' + msg;
};

log('✅ Three.js cargado');

// ============ ESCENA ============
const container = document.getElementById('canvas-container');
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87ceeb);

const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 500);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
container.appendChild(renderer.domElement);
log('✅ Renderer creado');

// ============ LUCES ============
const ambient = new THREE.AmbientLight(0xffffff, 0.7);
scene.add(ambient);

const hemi = new THREE.HemisphereLight(0xffffff, 0x88aa88, 0.9);
scene.add(hemi);

const sun = new THREE.DirectionalLight(0xffffff, 1.2);
sun.position.set(20, 30, 15);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -50;
sun.shadow.camera.right = 50;
sun.shadow.camera.top = 50;
sun.shadow.camera.bottom = -50;
sun.shadow.camera.near = 1;
sun.shadow.camera.far = 100;
scene.add(sun);
log('✅ Luces añadidas');

// ============ SUELO ============
const groundGeo = new THREE.PlaneGeometry(100, 100);
const groundMat = new THREE.MeshStandardMaterial({ color: 0x7ec850, roughness: 0.9 });
const ground = new THREE.Mesh(groundGeo, groundMat);
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

// Camino circular
const pathGeo = new THREE.RingGeometry(18, 21, 64);
const pathMat = new THREE.MeshStandardMaterial({
  color: 0xd9b382, roughness: 0.9, side: THREE.DoubleSide
});
const path = new THREE.Mesh(pathGeo, pathMat);
path.rotation.x = -Math.PI / 2;
path.position.y = 0.02;
path.receiveShadow = true;
scene.add(path);

// Fuente central
const fountain = new THREE.Mesh(
  new THREE.CylinderGeometry(2, 2.2, 0.6, 24),
  new THREE.MeshStandardMaterial({ color: 0xb0b0b0 })
);
fountain.position.y = 0.3;
fountain.castShadow = true;
scene.add(fountain);

const fountainTop = new THREE.Mesh(
  new THREE.CylinderGeometry(0.5, 0.5, 1.5, 16),
  new THREE.MeshStandardMaterial({ color: 0x9aa0a6 })
);
fountainTop.position.y = 1.35;
fountainTop.castShadow = true;
scene.add(fountainTop);

const waterBall = new THREE.Mesh(
  new THREE.SphereGeometry(0.5, 16, 12),
  new THREE.MeshStandardMaterial({ color: 0x5bc0eb })
);
waterBall.position.y = 2.2;
scene.add(waterBall);
log('✅ Suelo y fuente creados');

// ============ CASITAS (9) ============
const topics = [
  { name:'Números', icon:'🔢', color:0xff6b6b, pos:{x:-14, z:-14} },
  { name:'Divisibilidad', icon:'🧩', color:0x4ecdc4, pos:{x:-7, z:-16} },
  { name:'Fracciones', icon:'🍕', color:0xffa94d, pos:{x:0, z:-16} },
  { name:'Decimales', icon:'🔬', color:0x845ef7, pos:{x:7, z:-16} },
  { name:'Porcentajes', icon:'📊', color:0xff922b, pos:{x:14, z:-14} },
  { name:'Geometría', icon:'📐', color:0x51cf66, pos:{x:16, z:0} },
  { name:'Medidas', icon:'⏱️', color:0x22b8cf, pos:{x:16, z:12} },
  { name:'Problemas', icon:'🧠', color:0xf06595, pos:{x:0, z:17} },
  { name:'Estadística', icon:'🎲', color:0x748ffc, pos:{x:-14, z:14} }
];

const houses = [];

topics.forEach(topic => {
  const g = new THREE.Group();
  // Base
  const base = new THREE.Mesh(
    new THREE.BoxGeometry(3.5, 2.5, 3.5),
    new THREE.MeshStandardMaterial({ color: 0xfbe5c8 })
  );
  base.position.y = 1.25;
  base.castShadow = true;
  base.receiveShadow = true;
  g.add(base);

  // Tejado
  const roof = new THREE.Mesh(
    new THREE.ConeGeometry(2.8, 1.8, 4),
    new THREE.MeshStandardMaterial({ color: topic.color, flatShading: true })
  );
  roof.position.y = 3.4;
  roof.rotation.y = Math.PI / 4;
  roof.castShadow = true;
  g.add(roof);

  // Puerta
  const door = new THREE.Mesh(
    new THREE.BoxGeometry(0.9, 1.5, 0.1),
    new THREE.MeshStandardMaterial({ color: 0x6b3e1d })
  );
  door.position.set(0, 0.75, 1.76);
  g.add(door);

  // Ventanas
  const winMat = new THREE.MeshStandardMaterial({ color: 0x9be0ff, emissive: 0x224466, emissiveIntensity: 0.4 });
  const win1 = new THREE.Mesh(new THREE.BoxGeometry(0.7, 0.7, 0.1), winMat);
  win1.position.set(-1, 1.5, 1.76);
  g.add(win1);
  const win2 = win1.clone();
  win2.position.x = 1;
  g.add(win2);

  // Sprite del icono flotante
  const canvas = document.createElement('canvas');
  canvas.width = 256;
  canvas.height = 256;
  const ctx = canvas.getContext('2d');
  ctx.beginPath();
  ctx.arc(128, 128, 110, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(255,255,255,0.9)';
  ctx.fill();
  ctx.strokeStyle = '#3a2c1b';
  ctx.lineWidth = 10;
  ctx.stroke();
  ctx.font = 'bold 140px Arial';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(topic.icon, 128, 138);
  const texture = new THREE.CanvasTexture(canvas);
  const spriteMat = new THREE.SpriteMaterial({ map: texture, depthTest: false });
  const sprite = new THREE.Sprite(spriteMat);
  sprite.scale.set(2, 2, 2);
  sprite.position.y = 5;
  g.add(sprite);

  g.position.set(topic.pos.x, 0, topic.pos.z);
  g.rotation.y = Math.atan2(-topic.pos.x, -topic.pos.z);
  scene.add(g);

  houses.push({ topic, mesh: g, x: topic.pos.x, z: topic.pos.z });
});
log('✅ ' + houses.length + ' casitas creadas');

// ============ PERSONAJE ============
const player = new THREE.Group();

// Cuerpo
const body = new THREE.Mesh(
  new THREE.CapsuleGeometry(0.5, 0.7, 4, 12),
  new THREE.MeshStandardMaterial({ color: 0xffb347 })
);
body.position.y = 1.0;
body.castShadow = true;
player.add(body);

// Cabeza
const head = new THREE.Mesh(
  new THREE.SphereGeometry(0.55, 16, 12),
  new THREE.MeshStandardMaterial({ color: 0xffe0b2 })
);
head.position.y = 2.0;
head.castShadow = true;
player.add(head);

// Pelo
const hair = new THREE.Mesh(
  new THREE.SphereGeometry(0.58, 16, 12, 0, Math.PI * 2, 0, Math.PI / 2),
  new THREE.MeshStandardMaterial({ color: 0x4a2c17 })
);
hair.position.y = 2.15;
player.add(hair);

// Ojos
const eyeMat = new THREE.MeshStandardMaterial({ color: 0x222222 });
const eyeL = new THREE.Mesh(new THREE.SphereGeometry(0.08, 8, 8), eyeMat);
eyeL.position.set(-0.18, 2.05, 0.48);
player.add(eyeL);
const eyeR = eyeL.clone();
eyeR.position.x = 0.18;
player.add(eyeR);

// Piernas
const legMat = new THREE.MeshStandardMaterial({ color: 0x3d5a99 });
const legL = new THREE.Mesh(new THREE.CapsuleGeometry(0.17, 0.5, 3, 8), legMat);
legL.position.set(-0.22, 0.3, 0);
legL.castShadow = true;
player.add(legL);
const legR = legL.clone();
legR.position.x = 0.22;
player.add(legR);

// Brazos
const armMat = new THREE.MeshStandardMaterial({ color: 0xffb347 });
const armL = new THREE.Mesh(new THREE.CapsuleGeometry(0.15, 0.5, 3, 8), armMat);
armL.position.set(-0.65, 1.05, 0);
armL.castShadow = true;
player.add(armL);
const armR = armL.clone();
armR.position.x = 0.65;
player.add(armR);

// Colocar al personaje en el centro
player.position.set(0, 0, 0);
scene.add(player);
log('✅ Personaje creado en (0,0,0)');

// ============ CÁMARA INICIAL ============
camera.position.set(0, 8, 12);
camera.lookAt(0, 1.5, 0);
log('✅ Cámara en ' + camera.position.x + ',' + camera.position.y + ',' + camera.position.z);

// ============ ESTADO ============
const state = {
  x: 0, z: 0,
  speed: 8,
  keys: {}
};

// ============ CONTROLES ============
window.addEventListener('keydown', (e) => {
  const k = e.key.toLowerCase();
  if (['arrowup','arrowdown','arrowleft','arrowright','w','a','s','d'].includes(k)) {
    e.preventDefault();
    state.keys[k] = true;
  }
});
window.addEventListener('keyup', (e) => {
  state.keys[e.key.toLowerCase()] = false;
});

// ============ RESIZE ============
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// ============ LOOP ============
const clock = new THREE.Clock();
const camOffset = new THREE.Vector3(0, 5, 9);
const tempCam = new THREE.Vector3();
const tempLook = new THREE.Vector3();

let frameCount = 0;
function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.1);

  // Movimiento
  let mx = 0, mz = 0;
  if (state.keys['arrowup'] || state.keys['w']) mz -= 1;
  if (state.keys['arrowdown'] || state.keys['s']) mz += 1;
  if (state.keys['arrowleft'] || state.keys['a']) mx -= 1;
  if (state.keys['arrowright'] || state.keys['d']) mx += 1;

  if (mx !== 0 || mz !== 0) {
    const len = Math.hypot(mx, mz);
    mx /= len;
    mz /= len;
    state.x += mx * state.speed * dt;
    state.z += mz * state.speed * dt;
    const targetAngle = Math.atan2(mx, mz);
    let diff = targetAngle - player.rotation.y;
    while (diff > Math.PI) diff -= Math.PI * 2;
    while (diff < -Math.PI) diff += Math.PI * 2;
    player.rotation.y += diff * 10 * dt;
  }

  // Limitar
  state.x = Math.max(-40, Math.min(40, state.x));
  state.z = Math.max(-40, Math.min(40, state.z));
  player.position.set(state.x, 0, state.z);

  // Animar agua
  waterBall.position.y = 2.2 + Math.sin(clock.elapsedTime * 3) * 0.15;

  // Cámara sigue al jugador
  const angle = player.rotation.y;
  const rotatedOffset = camOffset.clone().applyAxisAngle(new THREE.Vector3(0,1,0), angle);
  tempCam.set(state.x, 0, state.z).add(rotatedOffset);
  camera.position.lerp(tempCam, 5 * dt);
  tempLook.set(state.x, 1.5, state.z);
  camera.lookAt(tempLook);

  renderer.render(scene, camera);

  frameCount++;
  if (frameCount === 60) {
    log('✅ 60 frames renderizados OK');
    document.getElementById('loading').style.opacity = '0';
    setTimeout(() => document.getElementById('loading').style.display = 'none', 500);
  }
}

animate();
log('✅ Bucle de animación iniciado');
</script>
</body>
</html>
