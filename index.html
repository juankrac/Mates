<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Expedición Matemática 3D</title>
<style>
  * { box-sizing: border-box; user-select: none; }
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    overflow: hidden;
    font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
    background: #87ceeb;
  }
  #canvas-container { width: 100vw; height: 100vh; display: block; }

  /* HUD */
  #hud {
    position: fixed; top: 16px; left: 16px; right: 16px;
    display: flex; justify-content: space-between; align-items: flex-start;
    pointer-events: none; z-index: 10;
  }
  .panel {
    background: rgba(254, 247, 224, 0.95);
    border: 3px solid #b98c5c;
    border-radius: 100px;
    padding: 8px 20px;
    box-shadow: 0 6px 0 #8b6f4c, 0 10px 20px rgba(0,0,0,0.3);
    font-weight: 800;
    color: #3a2c1b;
    font-size: 1.2rem;
    display: flex; align-items: center; gap: 10px;
    pointer-events: auto;
  }
  .stars-total { background: #ffd966; }
  .stars-total .num { font-size: 1.5rem; }

  #hint {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
    background: rgba(254, 247, 224, 0.95);
    border: 3px solid #b98c5c;
    border-radius: 50px;
    padding: 10px 24px;
    font-weight: 700; color: #3a2c1b;
    box-shadow: 0 6px 0 #8b6f4c;
    z-index: 10;
    text-align: center;
    font-size: 0.95rem;
    transition: opacity 0.3s;
    pointer-events: none;
  }

  /* Controles táctiles */
  #touch-controls {
    position: fixed; bottom: 20px; right: 20px;
    display: grid;
    grid-template-columns: repeat(3, 60px);
    grid-template-rows: repeat(3, 60px);
    gap: 6px;
    z-index: 15;
  }
  #touch-controls button {
    background: #ffd966;
    border: 3px solid #b98c5c;
    border-radius: 14px;
    font-size: 1.8rem;
    font-weight: 900;
    color: #3a2c1b;
    cursor: pointer;
    box-shadow: 0 5px 0 #8b6f4c;
    display: flex; align-items: center; justify-content: center;
    padding: 0;
    transition: 0.05s;
  }
  #touch-controls button:active { transform: translateY(4px); box-shadow: 0 1px 0 #8b6f4c; }
  #touch-controls .empty { visibility: hidden; }
  #touch-controls .action {
    grid-column: span 3;
    width: 100%;
    background: #ff9d5c;
    font-size: 1rem;
    height: 52px;
  }

  /* Modal */
  #modal {
    display: none;
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.75);
    justify-content: center; align-items: center;
    z-index: 100;
    padding: 16px;
  }
  #modal .card {
    background: #fef7e0;
    border-radius: 40px;
    padding: 28px 24px;
    max-width: 520px; width: 100%;
    border: 6px solid #b98c5c;
    box-shadow: 0 20px 40px black;
    text-align: center;
    animation: pop 0.25s ease-out;
  }
  @keyframes pop {
    0% { transform: scale(0.7); opacity: 0; }
    100% { transform: scale(1); opacity: 1; }
  }
  .card h2 {
    font-size: 1.7rem; margin: 0 0 8px; color: #3a2c1b;
    display: flex; justify-content: center; align-items: center; gap: 10px;
  }
  .card .question {
    font-size: 1.6rem; font-weight: 700;
    background: #e6d5b8;
    padding: 18px;
    border-radius: 30px;
    margin: 16px 0;
    border: 2px solid #b98c5c;
    word-break: break-word;
  }
  .card input {
    font-size: 1.7rem; width: 160px; text-align: center;
    padding: 8px; border-radius: 30px;
    border: 4px solid #b98c5c;
    font-weight: 700; background: white;
  }
  .card input:focus { outline: 3px solid #ffb347; }
  .card .btns { display: flex; gap: 14px; justify-content: center; margin-top: 20px; flex-wrap: wrap; }
  .card button {
    background: #ffd966; border: none;
    font-weight: 700; font-size: 1.15rem;
    padding: 12px 26px;
    border-radius: 40px;
    border-bottom: 6px solid #b98c5c;
    cursor: pointer; color: #2c1e0e;
    box-shadow: 0 6px 0 #8b6f4c;
    font-family: inherit;
    transition: 0.05s;
  }
  .card button:active { transform: translateY(4px); box-shadow: 0 2px 0 #8b6f4c; }
  .card button:disabled { opacity: 0.5; pointer-events: none; }
  .feedback { font-size: 1.3rem; font-weight: 700; min-height: 2rem; margin: 6px 0; }
  .success { color: #2e7d32; }
  .error { color: #c0392b; }
  .stars-earned { font-size: 1.4rem; color: #b47c2e; min-height: 1.8rem; font-weight: 700; }

  @media (max-width: 700px) {
    .panel { font-size: 0.9rem; padding: 6px 14px; }
    .stars-total .num { font-size: 1.2rem; }
    #touch-controls { grid-template-columns: repeat(3, 50px); grid-template-rows: repeat(3, 50px); }
    #touch-controls button { font-size: 1.4rem; }
    #hint { font-size: 0.8rem; padding: 8px 16px; bottom: 90px; }
  }
</style>
</head>
<body>

<div id="canvas-container"></div>

<div id="hud">
  <div class="panel">🧭 Expedición Matemática</div>
  <div class="panel stars-total">⭐ <span class="num" id="star-counter">0</span> / 81</div>
</div>

<div id="hint">🎮 Muévete con WASD o flechas · Acércate a una casita y pulsa <strong>ESPACIO</strong> o <strong>E</strong></div>

<div id="touch-controls">
  <button class="empty"></button>
  <button id="t-up">▲</button>
  <button class="empty"></button>
  <button id="t-left">◀</button>
  <button class="action" id="t-action">ENTRAR 🚪</button>
  <button id="t-right">▶</button>
  <button class="empty"></button>
  <button id="t-down">▼</button>
  <button class="empty"></button>
</div>

<div id="modal">
  <div class="card">
    <h2 id="modal-title">🏠 Casita</h2>
    <div id="question-text" class="question"></div>
    <input type="text" id="answer-input" placeholder="?" autocomplete="off" inputmode="text">
    <div id="feedback" class="feedback"></div>
    <div class="btns">
      <button id="check-btn">✅ Comprobar</button>
      <button id="close-btn">🔙 Salir</button>
    </div>
    <div id="stars-earned" class="stars-earned"></div>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';

// ---------- DATOS DE LOS TEMAS ----------
const topics = [
  { id:'numeros',       name:'Números y operaciones',  icon:'🔢', color:0xff6b6b, position:{x:-16, z:-16}, question:'¿Cuánto es 15 + 27?', answer:'42', stars:0, maxStars:9 },
  { id:'divisibilidad', name:'Divisibilidad',          icon:'🧩', color:0x4ecdc4, position:{x:-8,  z:-18}, question:'¿Cuál es el MCD de 12 y 18?', answer:'6', stars:0, maxStars:9 },
  { id:'fracciones',    name:'Fracciones',             icon:'🍕', color:0xffa94d, position:{x:0,   z:-18}, question:'¿Cuánto es 1/2 + 1/4? (ej: 3/4)', answer:'3/4', stars:0, maxStars:9 },
  { id:'decimales',     name:'Números decimales',      icon:'🔬', color:0x845ef7, position:{x:8,   z:-18}, question:'¿Cuánto es 2,5 + 1,75? (usa coma)', answer:'4,25', stars:0, maxStars:9 },
  { id:'porcentajes',   name:'Porcentajes',            icon:'📊', color:0xff922b, position:{x:16,  z:-16}, question:'¿Cuánto es el 20% de 150?', answer:'30', stars:0, maxStars:9 },
  { id:'geometria',     name:'Geometría',              icon:'📐', color:0x51cf66, position:{x:18,  z:0},   question:'Área de un rectángulo de 8×5 (solo número)', answer:'40', stars:0, maxStars:9 },
  { id:'medidas',       name:'Medidas',                icon:'⏱️', color:0x22b8cf, position:{x:18,  z:14},  question:'¿Cuántos cm hay en 3,5 metros?', answer:'350', stars:0, maxStars:9 },
  { id:'problemas',     name:'Problemas',              icon:'🧠', color:0xf06595, position:{x:0,   z:20},  question:'Si un lápiz cuesta 0,75 €, ¿4 lápices? (en €)', answer:'3', stars:0, maxStars:9 },
  { id:'estadistica',   name:'Estadística y probabilidad', icon:'🎲', color:0x748ffc, position:{x:-16, z:16}, question:'¿Cuál es la media de 4, 6 y 8?', answer:'6', stars:0, maxStars:9 }
];

const MAX_TOTAL_STARS = 81;
let totalStars = 0;

// ---------- ESCENA ----------
const container = document.getElementById('canvas-container');
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87ceeb);
scene.fog = new THREE.Fog(0x87ceeb, 40, 90);

const camera = new THREE.PerspectiveCamera(60, window.innerWidth/window.innerHeight, 0.1, 500);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
container.appendChild(renderer.domElement);

// ---------- LUCES ----------
const hemi = new THREE.HemisphereLight(0xffffff, 0x88aa88, 0.9);
scene.add(hemi);

const sun = new THREE.DirectionalLight(0xffffff, 1.6);
sun.position.set(25, 40, 20);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -50;
sun.shadow.camera.right = 50;
sun.shadow.camera.top = 50;
sun.shadow.camera.bottom = -50;
sun.shadow.camera.near = 1;
sun.shadow.camera.far = 120;
scene.add(sun);

// ---------- SUELO ----------
// Césped
const groundGeo = new THREE.PlaneGeometry(120, 120);
const groundMat = new THREE.MeshStandardMaterial({ color: 0x7ec850, roughness: 0.9 });
const ground = new THREE.Mesh(groundGeo, groundMat);
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

// Camino circular
const pathGeo = new THREE.RingGeometry(21, 24, 64);
const pathMat = new THREE.MeshStandardMaterial({ color: 0xd9b382, roughness: 0.9, side: THREE.DoubleSide });
const path = new THREE.Mesh(pathGeo, pathMat);
path.rotation.x = -Math.PI/2;
path.position.y = 0.02;
path.receiveShadow = true;
scene.add(path);

// Centro del pueblo: fuente
const centerBase = new THREE.Mesh(
  new THREE.CylinderGeometry(2.2, 2.4, 0.6, 24),
  new THREE.MeshStandardMaterial({ color: 0xb0b0b0, roughness: 0.6 })
);
centerBase.position.y = 0.3;
centerBase.castShadow = true;
centerBase.receiveShadow = true;
scene.add(centerBase);

const centerTop = new THREE.Mesh(
  new THREE.CylinderGeometry(0.6, 0.6, 1.5, 16),
  new THREE.MeshStandardMaterial({ color: 0x9aa0a6 })
);
centerTop.position.y = 1.35;
centerTop.castShadow = true;
scene.add(centerTop);

const waterBall = new THREE.Mesh(
  new THREE.SphereGeometry(0.5, 16, 12),
  new THREE.MeshStandardMaterial({ color: 0x5bc0eb, transparent: true, opacity: 0.85 })
);
waterBall.position.y = 2.2;
scene.add(waterBall);

// ---------- ÁRBOLES ----------
function createTree(x, z) {
  const g = new THREE.Group();
  const trunk = new THREE.Mesh(
    new THREE.CylinderGeometry(0.25, 0.35, 1.4, 8),
    new THREE.MeshStandardMaterial({ color: 0x8b5a2b, roughness: 1 })
  );
  trunk.position.y = 0.7;
  trunk.castShadow = true;
  g.add(trunk);

  const leavesMat = new THREE.MeshStandardMaterial({ color: 0x3d9e3d, roughness: 0.9, flatShading: true });
  const leaf1 = new THREE.Mesh(new THREE.ConeGeometry(1.3, 1.6, 8), leavesMat);
  leaf1.position.y = 1.9; leaf1.castShadow = true;
  g.add(leaf1);
  const leaf2 = new THREE.Mesh(new THREE.ConeGeometry(1.0, 1.3, 8), leavesMat);
  leaf2.position.y = 2.7; leaf2.castShadow = true;
  g.add(leaf2);
  const leaf3 = new THREE.Mesh(new THREE.ConeGeometry(0.7, 1.0, 8), leavesMat);
  leaf3.position.y = 3.4; leaf3.castShadow = true;
  g.add(leaf3);

  g.position.set(x, 0, z);
  g.rotation.y = Math.random() * Math.PI * 2;
  const s = 0.85 + Math.random() * 0.4;
  g.scale.set(s, s, s);
  return g;
}

const treePositions = [
  [-28,-28],[-24,-10],[-30,10],[-26,24],[-12,28],[0,30],[12,28],[26,24],
  [30,10],[28,-10],[24,-28],[-5,-30],[5,-30],[-32,-18],[32,-18],[-32,18],[32,18],
  [-40,-5],[40,-5],[-40,5],[40,5]
];
treePositions.forEach(p => scene.add(createTree(p[0], p[1])));

// ---------- CASITAS ----------
const houses = []; // {topic, mesh, x, z, radius}

function createHouse(topic) {
  const g = new THREE.Group();
  const color = topic.color;

  // Base
  const base = new THREE.Mesh(
    new THREE.BoxGeometry(4, 3, 4),
    new THREE.MeshStandardMaterial({ color: 0xfbe5c8, roughness: 0.9 })
  );
  base.position.y = 1.5;
  base.castShadow = true;
  base.receiveShadow = true;
  g.add(base);

  // Tejado (pirámide)
  const roofMat = new THREE.MeshStandardMaterial({ color, roughness: 0.7, flatShading: true });
  const roof = new THREE.Mesh(new THREE.ConeGeometry(3.3, 2.2, 4), roofMat);
  roof.position.y = 4.1;
  roof.rotation.y = Math.PI / 4;
  roof.castShadow = true;
  g.add(roof);

  // Puerta
  const door = new THREE.Mesh(
    new THREE.BoxGeometry(1.1, 1.8, 0.1),
    new THREE.MeshStandardMaterial({ color: 0x6b3e1d })
  );
  door.position.set(0, 0.9, 2.01);
  g.add(door);

  // Ventanas
  const windowMat = new THREE.MeshStandardMaterial({ color: 0x9be0ff, emissive: 0x224466, emissiveIntensity: 0.4 });
  const win1 = new THREE.Mesh(new THREE.BoxGeometry(0.9, 0.9, 0.1), windowMat);
  win1.position.set(-1.2, 1.7, 2.01);
  g.add(win1);
  const win2 = win1.clone();
  win2.position.x = 1.2;
  g.add(win2);

  // Icono flotante encima (Sprite con texto)
  const canvas = document.createElement('canvas');
  canvas.width = 256; canvas.height = 256;
  const ctx = canvas.getContext('2d');
  ctx.font = 'bold 160px Arial';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillStyle = 'rgba(255,255,255,0.9)';
  ctx.beginPath();
  ctx.arc(128, 128, 110, 0, Math.PI*2);
  ctx.fill();
  ctx.strokeStyle = '#3a2c1b';
  ctx.lineWidth = 10;
  ctx.stroke();
  ctx.font = 'bold 140px Arial';
  ctx.fillText(topic.icon, 128, 138);
  const texture = new THREE.CanvasTexture(canvas);
  const spriteMat = new THREE.SpriteMaterial({ map: texture, depthTest: false, depthWrite: false });
  const sprite = new THREE.Sprite(spriteMat);
  sprite.scale.set(2.2, 2.2, 2.2);
  sprite.position.y = 6.2;
  g.add(sprite);

  // Nombre del tema
  const labelCanvas = document.createElement('canvas');
  labelCanvas.width = 512; labelCanvas.height = 96;
  const lctx = labelCanvas.getContext('2d');
  lctx.fillStyle = 'rgba(254, 247, 224, 0.95)';
  lctx.strokeStyle = '#8b6f4c';
  lctx.lineWidth = 6;
  lctx.beginPath();
  lctx.roundRect(4, 4, 504, 88, 30);
  lctx.fill(); lctx.stroke();
  lctx.fillStyle = '#2c1e0e';
  lctx.font = 'bold 40px Arial';
  lctx.textAlign = 'center';
  lctx.textBaseline = 'middle';
  lctx.fillText(topic.name.length > 26 ? topic.name.slice(0,24)+'…' : topic.name, 256, 50);
  const labelTex = new THREE.CanvasTexture(labelCanvas);
  const labelMat = new THREE.SpriteMaterial({ map: labelTex, depthTest: false, depthWrite: false });
  const labelSprite = new THREE.Sprite(labelMat);
  labelSprite.scale.set(5, 0.95, 1);
  labelSprite.position.y = 7.4;
  g.add(labelSprite);

  g.position.set(topic.position.x, 0, topic.position.z);
  // Mirar hacia el centro
  g.rotation.y = Math.atan2(-topic.position.x, -topic.position.z);

  scene.add(g);
  houses.push({ topic, mesh: g, x: topic.position.x, z: topic.position.z, radius: 3.5 });
}

topics.forEach(createHouse);

// ---------- PERSONAJE ----------
const player = new THREE.Group();

// Cuerpo
const bodyMat = new THREE.MeshStandardMaterial({ color: 0xffb347, roughness: 0.8 });
const body = new THREE.Mesh(new THREE.CapsuleGeometry(0.5, 0.7, 4, 12), bodyMat);
body.position.y = 1.0;
body.castShadow = true;
player.add(body);

// Cabeza
const headMat = new THREE.MeshStandardMaterial({ color: 0xffe0b2 });
const head = new THREE.Mesh(new THREE.SphereGeometry(0.55, 16, 12), headMat);
head.position.y = 2.0;
head.castShadow = true;
player.add(head);

// Pelo
const hair = new THREE.Mesh(
  new THREE.SphereGeometry(0.58, 16, 12, 0, Math.PI*2, 0, Math.PI/2),
  new THREE.MeshStandardMaterial({ color: 0x4a2c17 })
);
hair.position.y = 2.15;
player.add(hair);

// Ojos
const eyeMat = new THREE.MeshStandardMaterial({ color: 0x222222 });
const eyeL = new THREE.Mesh(new THREE.SphereGeometry(0.08, 8, 8), eyeMat);
eyeL.position.set(-0.18, 2.05, 0.48);
player.add(eyeL);
const eyeR = eyeL.clone();
eyeR.position.x = 0.18;
player.add(eyeR);

// Sonrisa (pequeño toro)
const smile = new THREE.Mesh(
  new THREE.TorusGeometry(0.13, 0.025, 6, 12, Math.PI),
  new THREE.MeshStandardMaterial({ color: 0x8b3a1f })
);
smile.position.set(0, 1.85, 0.5);
smile.rotation.x = Math.PI;
smile.rotation.z = Math.PI;
player.add(smile);

// Brazos
const armMat = new THREE.MeshStandardMaterial({ color: 0xffb347 });
const armL = new THREE.Mesh(new THREE.CapsuleGeometry(0.15, 0.5, 3, 8), armMat);
armL.position.set(-0.65, 1.05, 0);
armL.castShadow = true;
player.add(armL);
const armR = armL.clone();
armR.position.x = 0.65;
player.add(armR);

// Piernas
const legMat = new THREE.MeshStandardMaterial({ color: 0x3d5a99 });
const legL = new THREE.Mesh(new THREE.CapsuleGeometry(0.17, 0.5, 3, 8), legMat);
legL.position.set(-0.22, 0.3, 0);
legL.castShadow = true;
player.add(legL);
const legR = legL.clone();
legR.position.x = 0.22;
player.add(legR);

player.position.set(0, 0, 0);
scene.add(player);

// ---------- ESTADO ----------
const state = {
  x: 0, z: 0,
  speed: 8,              // unidades por segundo
  radius: 0.6,
  keys: {},
  nearHouse: null,
  moving: false,
  walkCycle: 0
};

// ---------- CONTROLES ----------
window.addEventListener('keydown', (e) => {
  if (modalOpen) {
    if (e.key === 'Enter') { e.preventDefault(); checkAnswer(); }
    if (e.key === 'Escape') closeModal();
    return;
  }
  const k = e.key.toLowerCase();
  if (['arrowup','arrowdown','arrowleft','arrowright',' ','w','a','s','d'].includes(k)) e.preventDefault();
  state.keys[k] = true;
  if (k === ' ' || k === 'e') tryOpenNearbyHouse();
});

window.addEventListener('keyup', (e) => {
  const k = e.key.toLowerCase();
  state.keys[k] = false;
});

// Botones táctiles
function bindTouch(id, key) {
  const el = document.getElementById(id);
  const down = (e) => { e.preventDefault(); state.keys[key] = true; };
  const up = (e) => { e.preventDefault(); state.keys[key] = false; };
  el.addEventListener('touchstart', down, {passive:false});
  el.addEventListener('touchend', up);
  el.addEventListener('touchcancel', up);
  el.addEventListener('mousedown', down);
  el.addEventListener('mouseup', up);
  el.addEventListener('mouseleave', up);
}
bindTouch('t-up','arrowup');
bindTouch('t-down','arrowdown');
bindTouch('t-left','arrowleft');
bindTouch('t-right','arrowright');
document.getElementById('t-action').addEventListener('click', tryOpenNearbyHouse);

// Redimensionar
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// ---------- MODAL ----------
let modalOpen = false;
let currentTopic = null;
let answeredCorrectly = false;

const modalEl = document.getElementById('modal');
const modalTitle = document.getElementById('modal-title');
const questionText = document.getElementById('question-text');
const answerInput = document.getElementById('answer-input');
const feedbackEl = document.getElementById('feedback');
const starsEarnedEl = document.getElementById('stars-earned');
const checkBtn = document.getElementById('check-btn');
const closeBtn = document.getElementById('close-btn');
const starCounterEl = document.getElementById('star-counter');

function openModal(topic) {
  if (modalOpen) return;
  modalOpen = true;
  currentTopic = topic;
  answeredCorrectly = false;
  modalTitle.innerHTML = `${topic.icon} ${topic.name}`;
  questionText.textContent = topic.question;
  answerInput.value = '';
  answerInput.disabled = false;
  answerInput.focus();
  feedbackEl.textContent = '';
  feedbackEl.className = 'feedback';
  starsEarnedEl.textContent = '';
  checkBtn.disabled = false;
  modalEl.style.display = 'flex';
}

function closeModal() {
  modalEl.style.display = 'none';
  modalOpen = false;
  currentTopic = null;
}

function checkAnswer() {
  if (!currentTopic || answeredCorrectly) return;
  const user = answerInput.value.trim().replace(/\s/g,'').toLowerCase().replace(',', '.');
  const correct = currentTopic.answer.trim().replace(/\s/g,'').toLowerCase().replace(',', '.');

  let isCorrect = false;
  const uNum = parseFloat(user);
  const cNum = parseFloat(correct);
  if (!isNaN(uNum) && !isNaN(cNum)) {
    isCorrect = Math.abs(uNum - cNum) < 0.001;
  } else {
    isCorrect = user === correct;
  }
  // Comprobación fracciones
  if (!isCorrect && correct.includes('/')) {
    const [n,d] = correct.split('/').map(Number);
    if (!isNaN(n) && !isNaN(d) && d !== 0) {
      const dec = n/d;
      if (!isNaN(uNum)) isCorrect = Math.abs(uNum - dec) < 0.001;
    }
  }
  if (!isCorrect && user.includes('/')) {
    const [n,d] = user.split('/').map(Number);
    if (!isNaN(n) && !isNaN(d) && d !== 0 && !isNaN(cNum)) {
      isCorrect = Math.abs(n/d - cNum) < 0.001;
    }
  }

  if (isCorrect) {
    feedbackEl.textContent = '✅ ¡Correcto!';
    feedbackEl.className = 'feedback success';
    if (currentTopic.stars < currentTopic.maxStars) {
      currentTopic.stars++;
      totalStars = topics.reduce((a,t) => a + t.stars, 0);
      starCounterEl.textContent = totalStars;
      starsEarnedEl.textContent = `⭐ +1 estrella (${currentTopic.stars}/${currentTopic.maxStars})`;
      answeredCorrectly = true;
      checkBtn.disabled = true;
      answerInput.disabled = true;
      // Cambiar color tejado a dorado al completar
      if (currentTopic.stars === currentTopic.maxStars) {
        const house = houses.find(h => h.topic.id === currentTopic.id);
        if (house) {
          house.mesh.children[1].material.color.set(0xffd700);
        }
      }
    } else {
      starsEarnedEl.textContent = '🏆 ¡Nivel completado!';
    }
  } else {
    feedbackEl.textContent = '❌ Inténtalo de nuevo';
    feedbackEl.className = 'feedback error';
  }
}

checkBtn.addEventListener('click', checkAnswer);
closeBtn.addEventListener('click', closeModal);
answerInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') { e.preventDefault(); checkAnswer(); }
});
modalEl.addEventListener('click', (e) => { if (e.target === modalEl) closeModal(); });

// ---------- INTERACCIÓN CON CASAS ----------
function tryOpenNearbyHouse() {
  if (modalOpen) return;
  if (state.nearHouse) {
    openModal(state.nearHouse.topic);
  }
}

// ---------- LOOP PRINCIPAL ----------
const clock = new THREE.Clock();
const cameraOffset = new THREE.Vector3(0, 12, 12);

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.1);

  // Movimiento
  let mx = 0, mz = 0;
  if (state.keys['arrowup'] || state.keys['w']) mz -= 1;
  if (state.keys['arrowdown'] || state.keys['s']) mz += 1;
  if (state.keys['arrowleft'] || state.keys['a']) mx -= 1;
  if (state.keys['arrowright'] || state.keys['d']) mx += 1;

  if (mx !== 0 || mz !== 0) {
    const len = Math.hypot(mx, mz);
    mx /= len; mz /= len;
    state.x += mx * state.speed * dt;
    state.z += mz * state.speed * dt;
    state.moving = true;
    // Rotar personaje hacia la dirección
    const targetAngle = Math.atan2(mx, mz);
    // Suavizar rotación
    let diff = targetAngle - player.rotation.y;
    while (diff > Math.PI) diff -= Math.PI*2;
    while (diff < -Math.PI) diff += Math.PI*2;
    player.rotation.y += diff * 10 * dt;
    // Animación de caminar (balanceo)
    state.walkCycle += dt * 12;
    legL.rotation.x = Math.sin(state.walkCycle) * 0.5;
    legR.rotation.x = -Math.sin(state.walkCycle) * 0.5;
    armL.rotation.x = -Math.sin(state.walkCycle) * 0.5;
    armR.rotation.x = Math.sin(state.walkCycle) * 0.5;
  } else {
    state.moving = false;
    // Volver a posición de reposo
    legL.rotation.x *= 0.85;
    legR.rotation.x *= 0.85;
    armL.rotation.x *= 0.85;
    armR.rotation.x *= 0.85;
  }

  // Límite del mapa
  const limit = 38;
  state.x = Math.max(-limit, Math.min(limit, state.x));
  state.z = Math.max(-limit, Math.min(limit, state.z));

  player.position.set(state.x, 0, state.z);

  // Detección de casa cercana
  let nearest = null;
  let minDist = 5;
  for (const h of houses) {
    const d = Math.hypot(state.x - h.x, state.z - h.z);
    if (d < minDist) { minDist = d; nearest = h; }
  }
  state.nearHouse = nearest;

  // Actualizar hint
  const hintEl = document.getElementById('hint');
  if (nearest) {
    hintEl.innerHTML = `🚪 <strong>${nearest.topic.icon} ${nearest.topic.name}</strong> — Pulsa <strong>ESPACIO</strong> o el botón ENTRAR`;
    hintEl.style.opacity = '1';
  } else {
    hintEl.innerHTML = `🎮 Muévete con WASD o flechas · Acércate a una casita y pulsa <strong>ESPACIO</strong>`;
    hintEl.style.opacity = '0.9';
  }

  // Cámara sigue al jugador (vista isométrica)
  const targetCamPos = new THREE.Vector3(state.x, 0, state.z).add(cameraOffset);
  camera.position.lerp(targetCamPos, 5 * dt);
  camera.lookAt(state.x, 1.5, state.z);

  // Animar agua de la fuente
  waterBall.position.y = 2.2 + Math.sin(clock.elapsedTime * 3) * 0.15;

  renderer.render(scene, camera);
}

animate();

// Inicializar contador
starCounterEl.textContent = totalStars;
</script>
