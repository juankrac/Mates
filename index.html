<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Test Three.js</title>
<style>
  body { margin: 0; font-family: monospace; background: #222; color: #0f0; padding: 20px; }
  #log { font-size: 14px; line-height: 1.6; }
  #canvas-container { width: 100vw; height: 60vh; margin-top: 10px; }
  .ok { color: #0f0; }
  .err { color: #f66; }
  .warn { color: #ff0; }
</style>
</head>
<body>
<div id="log"></div>
<div id="canvas-container"></div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
  }
}
</script>

<script type="module">
const logEl = document.getElementById('log');
function log(msg, cls = 'ok') {
  logEl.innerHTML += `<div class="${cls}">${msg}</div>`;
  console.log(msg);
}

log('1️⃣ Script iniciado');

try {
  log('2️⃣ Importando Three.js…');
  const THREE = await import('three');
  log('3️⃣ Three.js cargado correctamente. Versión: ' + THREE.REVISION);

  log('4️⃣ Creando escena…');
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x87ceeb);

  log('5️⃣ Creando cámara…');
  const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
  camera.position.set(0, 5, 10);
  camera.lookAt(0, 0, 0);

  log('6️⃣ Creando renderer…');
  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(window.innerWidth, 500);
  document.getElementById('canvas-container').appendChild(renderer.domElement);

  log('7️⃣ Añadiendo luces…');
  scene.add(new THREE.AmbientLight(0xffffff, 0.8));
  const light = new THREE.DirectionalLight(0xffffff, 1);
  light.position.set(5, 10, 5);
  scene.add(light);

  log('8️⃣ Creando suelo…');
  const ground = new THREE.Mesh(
    new THREE.PlaneGeometry(20, 20),
    new THREE.MeshStandardMaterial({ color: 0x7ec850 })
  );
  ground.rotation.x = -Math.PI / 2;
  scene.add(ground);

  log('9️⃣ Creando cubo rojo…');
  const cube = new THREE.Mesh(
    new THREE.BoxGeometry(2, 2, 2),
    new THREE.MeshStandardMaterial({ color: 0xff0000 })
  );
  cube.position.y = 1;
  scene.add(cube);

  log('🔟 Iniciando bucle…');
  function animate() {
    requestAnimationFrame(animate);
    cube.rotation.y += 0.01;
    renderer.render(scene, camera);
  }
  animate();

  log('✅ TODO FUNCIONA. Deberías ver un cubo rojo girando sobre césped verde.', 'ok');

} catch (err) {
  log('❌ ERROR: ' + err.message, 'err');
  log('Stack: ' + err.stack, 'err');
  console.error(err);
}
</script>
</body>
</html>
