<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Expedición Matemática - Pueblo de Aventuras</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
    }
    body {
      margin: 0;
      min-height: 100vh;
      background: #1a2a1a;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
      padding: 8px;
    }
    #game-container {
      width: 1000px;
      max-width: 100%;
      background: #2d4a2d;
      border-radius: 32px;
      box-shadow: 0 20px 30px rgba(0,0,0,0.6);
      padding: 20px;
      border: 4px solid #b98c5c;
      position: relative;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #fef7e0;
      border-radius: 100px;
      padding: 10px 25px;
      margin-bottom: 16px;
      border: 3px solid #c9a87c;
      box-shadow: inset 0 2px 5px rgba(0,0,0,0.1);
      flex-wrap: wrap;
    }
    .title {
      display: flex;
      align-items: center;
      gap: 12px;
      font-weight: 800;
      font-size: 1.6rem;
      color: #3a2c1b;
      letter-spacing: 1px;
    }
    .title span {
      font-size: 2rem;
    }
    .stars-total {
      background: #ffd966;
      padding: 8px 20px;
      border-radius: 40px;
      font-weight: 700;
      font-size: 1.3rem;
      color: #4d3e1a;
      border: 2px solid #b98c5c;
      box-shadow: 0 4px 0 #8b6f4c;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .stars-total span {
      font-size: 1.8rem;
    }
    /* MAPA DEL PUEBLO */
    #map {
      position: relative;
      background: #9ac791;
      background-image: radial-gradient(circle at 20% 30%, #b1d9a8 10%, transparent 20%),
                        radial-gradient(circle at 80% 70%, #b1d9a8 15%, transparent 25%);
      border-radius: 32px;
      border: 6px solid #7a5c3a;
      height: 550px;
      overflow: hidden;
      box-shadow: inset 0 0 30px rgba(0,0,0,0.2);
      margin-bottom: 12px;
      cursor: default;
    }
    .house {
      position: absolute;
      width: 110px;
      height: 110px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      transition: transform 0.2s;
      cursor: pointer;
      filter: drop-shadow(0 8px 6px rgba(0,0,0,0.3));
      z-index: 5;
    }
    .house:hover {
      transform: scale(1.05);
    }
    .house.roof {
      width: 0;
      height: 0;
      border-left: 55px solid transparent;
      border-right: 55px solid transparent;
      border-bottom: 45px solid #b35e3c;
      position: relative;
      top: 5px;
      margin-bottom: -45px;
      z-index: 2;
    }
    .house.base {
      width: 90px;
      height: 65px;
      background: #e6c9a8;
      border-radius: 8px 8px 12px 12px;
      border: 4px solid #8b6b4b;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
      font-weight: bold;
      color: #3a2c1b;
      box-shadow: inset 0 -8px 0 #b3926e;
      z-index: 3;
      position: relative;
    }
    .house.base .icon {
      font-size: 2.3rem;
      line-height: 1;
      margin-bottom: 2px;
    }
    .house-label {
      font-size: 0.75rem;
      font-weight: 700;
      text-align: center;
      background: rgba(255,255,240,0.9);
      padding: 2px 6px;
      border-radius: 20px;
      margin-top: 4px;
      width: 100px;
      border: 1px solid #8b6b4b;
      color: #2c1e0e;
      z-index: 5;
      position: relative;
      top: -8px;
    }
    /* PERSONAJE */
    #character {
      position: absolute;
      width: 60px;
      height: 60px;
      background: #ffb347;
      border-radius: 50% 50% 30% 30%;
      border: 5px solid #6b4f2e;
      box-shadow: 0 10px 0 #6b4f2e, 0 12px 15px rgba(0,0,0,0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
      transition: left 0.1s, top 0.1s;
      z-index: 20;
      transform: translate(-50%, -50%);
      pointer-events: none;
    }
    #character::after {
      content: "🧒";
      font-size: 2.5rem;
      filter: drop-shadow(0 2px 2px rgba(0,0,0,0.3));
    }
    /* MODAL DE EJERCICIOS */
    #modal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.7);
      justify-content: center;
      align-items: center;
      z-index: 1000;
      padding: 16px;
    }
    #modal .card {
      background: #fef7e0;
      border-radius: 40px;
      padding: 28px 24px;
      max-width: 500px;
      width: 100%;
      border: 6px solid #b98c5c;
      box-shadow: 0 20px 30px black;
      text-align: center;
    }
    .card h2 {
      font-size: 1.9rem;
      margin: 0 0 12px;
      color: #3a2c1b;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
    }
    .card .question {
      font-size: 1.8rem;
      font-weight: 700;
      background: #e6d5b8;
      padding: 18px;
      border-radius: 30px;
      margin: 16px 0;
      word-break: break-word;
      border: 2px solid #b98c5c;
    }
    .card input {
      font-size: 1.8rem;
      width: 140px;
      text-align: center;
      padding: 8px;
      border-radius: 30px;
      border: 4px solid #b98c5c;
      font-weight: 700;
      background: white;
      margin: 10px 0;
    }
    .card input:focus {
      outline: 3px solid #ffb347;
    }
    .card .btns {
      display: flex;
      gap: 16px;
      justify-content: center;
      margin-top: 24px;
      flex-wrap: wrap;
    }
    .card button {
      background: #ffd966;
      border: none;
      font-weight: 700;
      font-size: 1.3rem;
      padding: 14px 30px;
      border-radius: 40px;
      border-bottom: 6px solid #b98c5c;
      cursor: pointer;
      color: #2c1e0e;
      transition: 0.07s;
      font-family: inherit;
      box-shadow: 0 6px 0 #8b6f4c;
    }
    .card button:active {
      transform: translateY(4px);
      box-shadow: 0 2px 0 #8b6f4c;
    }
    .card button:disabled {
      opacity: 0.5;
      transform: translateY(4px);
      box-shadow: 0 2px 0 #8b6f4c;
      pointer-events: none;
    }
    .card .feedback {
      font-size: 1.5rem;
      font-weight: 700;
      min-height: 2.5rem;
      margin: 8px 0;
    }
    .card .stars-earned {
      font-size: 1.8rem;
      color: #b47c2e;
    }
    /* CONTROLES */
    .controls {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-top: 8px;
      flex-wrap: wrap;
    }
    .controls button {
      background: #fef7e0;
      border: 3px solid #b98c5c;
      border-radius: 50px;
      width: 70px;
      height: 70px;
      font-size: 2.5rem;
      cursor: pointer;
      box-shadow: 0 6px 0 #8b6f4c;
      transition: 0.05s;
      display: flex;
      align-items: center;
      justify-content: center;
      line-height: 1;
      color: #3a2c1b;
      font-weight: bold;
      background: #ffd966;
    }
    .controls button:active {
      transform: translateY(4px);
      box-shadow: 0 2px 0 #8b6f4c;
    }
    .controls button:disabled {
      opacity: 0.4;
      transform: translateY(4px);
      box-shadow: 0 2px 0 #8b6f4c;
      pointer-events: none;
    }
    .legend {
      display: flex;
      justify-content: center;
      gap: 24px;
      color: #fef7e0;
      font-weight: 600;
      margin-top: 12px;
      font-size: 0.9rem;
      text-shadow: 1px 1px 0 #1a2a1a;
      flex-wrap: wrap;
    }
    .legend span {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .error {
      color: #c0392b;
    }
    .success {
      color: #2e7d32;
    }
  </style>
</head>
<body>
<div id="game-container">
  <div class="header">
    <div class="title"><span>🧭</span> Expedición Matemática</div>
    <div class="stars-total"><span>⭐</span> <span id="star-counter">0</span> / 81</div>
  </div>

  <div id="map">
    <!-- Las casitas se generarán aquí con JS -->
    <div id="character" style="left: 500px; top: 300px;"></div>
  </div>

  <div class="controls">
    <button id="btn-up" aria-label="Arriba">▲</button>
    <button id="btn-left" aria-label="Izquierda">◀</button>
    <button id="btn-down" aria-label="Abajo">▼</button>
    <button id="btn-right" aria-label="Derecha">▶</button>
  </div>
  <div class="legend">
    <span>🧒 Muévete con las flechas del teclado o los botones</span>
    <span>🏠 Acércate a una casita y pulsa <strong>ESPACIO</strong> o toca la casita</span>
  </div>
</div>

<!-- MODAL DE EJERCICIO -->
<div id="modal">
  <div class="card">
    <h2 id="modal-title">🏠 Casita</h2>
    <div id="question-text" class="question">¿Cuánto es 2 + 2?</div>
    <input type="text" id="answer-input" placeholder="?" autocomplete="off" inputmode="numeric">
    <div id="feedback" class="feedback"></div>
    <div class="btns">
      <button id="check-btn">✅ Comprobar</button>
      <button id="close-btn">🔙 Salir</button>
    </div>
    <div id="stars-earned" class="stars-earned"></div>
  </div>
</div>

<script>
  (function() {
    // ----- DATOS DE LOS TEMAS (9 casitas) -----
    const topics = [
      { id: 'numeros', name: 'Números y operaciones', icon: '🔢', position: { x: 120, y: 70 }, question: '¿Cuánto es 15 + 27?', answer: '42', stars: 0, maxStars: 9 },
      { id: 'divisibilidad', name: 'Divisibilidad', icon: '🧩', position: { x: 380, y: 50 }, question: '¿Cuál es el MCD de 12 y 18?', answer: '6', stars: 0, maxStars: 9 },
      { id: 'fracciones', name: 'Fracciones', icon: '🍕', position: { x: 640, y: 70 }, question: '¿Cuánto es 1/2 + 1/4? (escribe como fracción ej: 3/4)', answer: '3/4', stars: 0, maxStars: 9 },
      { id: 'decimales', name: 'Números decimales', icon: '🔬', position: { x: 860, y: 130 }, question: '¿Cuánto es 2,5 + 1,75? (usa coma)', answer: '4,25', stars: 0, maxStars: 9 },
      { id: 'porcentajes', name: 'Porcentajes y proporcionalidad', icon: '📊', position: { x: 820, y: 350 }, question: '¿Cuánto es el 20% de 150?', answer: '30', stars: 0, maxStars: 9 },
      { id: 'geometria', name: 'Geometría', icon: '📐', position: { x: 560, y: 420 }, question: '¿Cuál es el área de un rectángulo de base 8 cm y altura 5 cm? (solo número)', answer: '40', stars: 0, maxStars: 9 },
      { id: 'medidas', name: 'Medidas', icon: '⏱️', position: { x: 280, y: 430 }, question: '¿Cuántos centímetros hay en 3,5 metros?', answer: '350', stars: 0, maxStars: 9 },
      { id: 'problemas', name: 'Problemas', icon: '🧠', position: { x: 100, y: 330 }, question: 'Si un lápiz cuesta 0,75 €, ¿cuánto cuestan 4 lápices? (en €)', answer: '3', stars: 0, maxStars: 9 },
      { id: 'estadistica', name: 'Estadística y probabilidad', icon: '🎲', position: { x: 400, y: 250 }, question: '¿Cuál es la media de 4, 6 y 8?', answer: '6', stars: 0, maxStars: 9 }
    ];

    // Estrellas totales máximas: 9 temas * 9 estrellas = 81
    const MAX_TOTAL_STARS = 81;
    let totalStars = 0;

    // Posición del personaje (coordenadas dentro del mapa)
    let charX = 500;
    let charY = 300;
    const SPEED = 25;
    const CHAR_RADIUS = 30; // para detección de colisión

    // Referencias DOM
    const mapEl = document.getElementById('map');
    const characterEl = document.getElementById('character');
    const starCounterEl = document.getElementById('star-counter');
    const modalEl = document.getElementById('modal');
    const modalTitle = document.getElementById('modal-title');
    const questionText = document.getElementById('question-text');
    const answerInput = document.getElementById('answer-input');
    const feedbackEl = document.getElementById('feedback');
    const starsEarnedEl = document.getElementById('stars-earned');
    const checkBtn = document.getElementById('check-btn');
    const closeBtn = document.getElementById('close-btn');

    // Estado del modal
    let currentTopic = null;
    let modalOpen = false;
    let answeredCorrectly = false; // para evitar sumar estrellas varias veces en la misma visita

    // ----- INICIALIZAR CASITAS -----
    function renderHouses() {
      // Eliminar casitas antiguas
      document.querySelectorAll('.house').forEach(h => h.remove());
      topics.forEach(topic => {
        const houseDiv = document.createElement('div');
        houseDiv.className = 'house';
        houseDiv.style.left = topic.position.x + 'px';
        houseDiv.style.top = topic.position.y + 'px';
        houseDiv.dataset.topicId = topic.id;

        // Tejado
        const roof = document.createElement('div');
        roof.className = 'house roof';
        // Base
        const base = document.createElement('div');
        base.className = 'house base';
        const iconSpan = document.createElement('div');
        iconSpan.className = 'icon';
        iconSpan.textContent = topic.icon;
        base.appendChild(iconSpan);
        // Etiqueta
        const label = document.createElement('div');
        label.className = 'house-label';
        label.textContent = topic.name.length > 20 ? topic.name.slice(0, 18) + '…' : topic.name;

        houseDiv.appendChild(roof);
        houseDiv.appendChild(base);
        houseDiv.appendChild(label);

        // Click en la casita abre el modal si el personaje está cerca
        houseDiv.addEventListener('click', (e) => {
          e.stopPropagation();
          const dist = Math.hypot(charX - (topic.position.x + 55), charY - (topic.position.y + 55));
          if (dist < 100) {
            openModal(topic);
          } else {
            // Pequeña pista visual
            houseDiv.style.transform = 'scale(0.95)';
            setTimeout(() => houseDiv.style.transform = '', 150);
            feedbackEl.textContent = ''; // no mostrar nada
          }
        });

        mapEl.appendChild(houseDiv);
      });
    }

    // ----- ACTUALIZAR POSICIÓN DEL PERSONAJE -----
    function updateCharacterPosition() {
      characterEl.style.left = charX + 'px';
      characterEl.style.top = charY + 'px';
    }

    // ----- MOVIMIENTO -----
    function moveCharacter(dx, dy) {
      if (modalOpen) return; // no mover si el modal está abierto

      let newX = charX + dx;
      let newY = charY + dy;

      // Límites del mapa (con margen para el personaje)
      const mapRect = mapEl.getBoundingClientRect();
      const mapWidth = mapEl.clientWidth;
      const mapHeight = mapEl.clientHeight;

      // El personaje está centrado con transform, así que limitamos considerando su radio visual
      const margin = 30;
      newX = Math.max(margin, Math.min(mapWidth - margin, newX));
      newY = Math.max(margin, Math.min(mapHeight - margin, newY));

      charX = newX;
      charY = newY;
      updateCharacterPosition();

      // Comprobar si está cerca de alguna casita (para feedback visual)
      highlightNearbyHouse();
    }

    // Resaltar casita cercana (opcional)
    function highlightNearbyHouse() {
      document.querySelectorAll('.house').forEach(h => {
        const rect = h.getBoundingClientRect();
        const mapRect = mapEl.getBoundingClientRect();
        // Posición central de la casita en coordenadas del mapa
        const houseX = parseFloat(h.style.left) + 55;
        const houseY = parseFloat(h.style.top) + 55;
        const dist = Math.hypot(charX - houseX, charY - houseY);
        if (dist < 100) {
          h.style.filter = 'drop-shadow(0 0 12px #ffd966)';
        } else {
          h.style.filter = 'drop-shadow(0 8px 6px rgba(0,0,0,0.3))';
        }
      });
    }

    // ----- DETECTAR CASITA CERCANA Y ABRIR CON ESPACIO -----
    function tryOpenNearbyHouse() {
      if (modalOpen) return;

      let nearestTopic = null;
      let minDist = 120; // distancia máxima para interactuar

      topics.forEach(topic => {
        const houseX = topic.position.x + 55;
        const houseY = topic.position.y + 55;
        const dist = Math.hypot(charX - houseX, charY - houseY);
        if (dist < minDist) {
          minDist = dist;
          nearestTopic = topic;
        }
      });

      if (nearestTopic) {
        openModal(nearestTopic);
      }
    }

    // ----- MODAL -----
    function openModal(topic) {
      if (modalOpen) return;
      modalOpen = true;
      currentTopic = topic;
      answeredCorrectly = false;

      modalTitle.innerHTML = `${topic.icon} ${topic.name}`;
      questionText.textContent = topic.question;
      answerInput.value = '';
      feedbackEl.textContent = '';
      starsEarnedEl.textContent = '';
      answerInput.disabled = false;
      checkBtn.disabled = false;
      answerInput.focus();

      modalEl.style.display = 'flex';
    }

    function closeModal() {
      modalEl.style.display = 'none';
      modalOpen = false;
      currentTopic = null;
      // Devolver foco al mapa
    }

    // Comprobar respuesta
    function checkAnswer() {
      if (!currentTopic || answeredCorrectly) return;

      const userAnswer = answerInput.value.trim().replace(/\s/g, '').toLowerCase();
      const correctAnswer = currentTopic.answer.trim().replace(/\s/g, '').toLowerCase();

      // Normalizar comas y puntos para decimales
      const normalize = (str) => str.replace(',', '.');
      const userNorm = normalize(userAnswer);
      const correctNorm = normalize(correctAnswer);

      let isCorrect = false;

      // Comparación numérica si es posible
      if (!isNaN(parseFloat(userNorm)) && !isNaN(parseFloat(correctNorm))) {
        isCorrect = Math.abs(parseFloat(userNorm) - parseFloat(correctNorm)) < 0.001;
      } else {
        // Comparación exacta (para fracciones como "3/4")
        isCorrect = userNorm === correctNorm;
      }

      // También permitir "3/4" vs "0.75"? No, lo dejamos simple pero comprobamos si es fracción
      if (!isCorrect && correctNorm.includes('/')) {
        // Convertir fracción correcta a decimal
        const parts = correctNorm.split('/');
        if (parts.length === 2) {
          const num = parseFloat(parts[0]);
          const den = parseFloat(parts[1]);
          if (!isNaN(num) && !isNaN(den) && den !== 0) {
            const decimalCorrect = num / den;
            if (!isNaN(parseFloat(userNorm))) {
              isCorrect = Math.abs(parseFloat(userNorm) - decimalCorrect) < 0.001;
            }
          }
        }
      }

      // Si la respuesta del usuario es fracción y la correcta es decimal
      if (!isCorrect && userNorm.includes('/')) {
        const parts = userNorm.split('/');
        if (parts.length === 2) {
          const num = parseFloat(parts[0]);
          const den = parseFloat(parts[1]);
          if (!isNaN(num) && !isNaN(den) && den !== 0) {
            const decimalUser = num / den;
            if (!isNaN(parseFloat(correctNorm))) {
              isCorrect = Math.abs(decimalUser - parseFloat(correctNorm)) < 0.001;
            }
          }
        }
      }

      if (isCorrect) {
        feedbackEl.textContent = '✅ ¡Correcto!';
        feedbackEl.className = 'feedback success';
        if (!answeredCorrectly && currentTopic.stars < currentTopic.maxStars) {
          currentTopic.stars += 1;
          totalStars = topics.reduce((acc, t) => acc + t.stars, 0);
          updateStarDisplay();
          starsEarnedEl.textContent = `⭐ +1 estrella (${currentTopic.stars}/${currentTopic.maxStars})`;
          answeredCorrectly = true;
          // Actualizar estrellas visuales en la casita? Podríamos añadir indicador pero no es necesario
        } else if (currentTopic.stars >= currentTopic.maxStars) {
          starsEarnedEl.textContent = `🏆 ¡Nivel completado!`;
        } else {
          starsEarnedEl.textContent = `⭐ Ya ganaste estrella en esta visita`;
        }
        checkBtn.disabled = true;
        answerInput.disabled = true;
      } else {
        feedbackEl.textContent = '❌ Inténtalo de nuevo';
        feedbackEl.className = 'feedback error';
        starsEarnedEl.textContent = '';
        // No deshabilitamos para que pueda reintentar
      }
    }

    function updateStarDisplay() {
      starCounterEl.textContent = totalStars;
    }

    // ----- EVENTOS -----
    // Teclado
    window.addEventListener('keydown', (e) => {
      // Evitar que las flechas hagan scroll
      if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', ' '].includes(e.key)) {
        e.preventDefault();
      }

      if (modalOpen) {
        // Si el modal está abierto, Enter envía respuesta
        if (e.key === 'Enter') {
          e.preventDefault();
          checkAnswer();
        }
        if (e.key === 'Escape') {
          closeModal();
        }
        return;
      }

      // Movimiento
      if (e.key === 'ArrowUp') moveCharacter(0, -SPEED);
      if (e.key === 'ArrowDown') moveCharacter(0, SPEED);
      if (e.key === 'ArrowLeft') moveCharacter(-SPEED, 0);
      if (e.key === 'ArrowRight') moveCharacter(SPEED, 0);

      // Espacio para abrir casita cercana
      if (e.key === ' ') {
        e.preventDefault();
        tryOpenNearbyHouse();
      }
    });

    // Botones de control
    document.getElementById('btn-up').addEventListener('click', () => moveCharacter(0, -SPEED));
    document.getElementById('btn-down').addEventListener('click', () => moveCharacter(0, SPEED));
    document.getElementById('btn-left').addEventListener('click', () => moveCharacter(-SPEED, 0));
    document.getElementById('btn-right').addEventListener('click', () => moveCharacter(SPEED, 0));

    // Botones del modal
    checkBtn.addEventListener('click', checkAnswer);
    closeBtn.addEventListener('click', closeModal);
    answerInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
        checkAnswer();
      }
    });

    // Cerrar modal haciendo click fuera
    modalEl.addEventListener('click', (e) => {
      if (e.target === modalEl) closeModal();
    });

    // Inicializar
    function init() {
      renderHouses();
      charX = 500;
      charY = 300;
      updateCharacterPosition();
      totalStars = topics.reduce((acc, t) => acc + t.stars, 0);
      updateStarDisplay();
      highlightNearbyHouse();
    }

    init();
  })();
</script>
</body>
</html>
